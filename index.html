<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archives — Koch Capital</title>
  <meta name="description" content="Frontier-first commentary from Koch Capital — venture capital for the sovereign stack.">

  <!-- Open Graph -->
  <meta property="og:title" content="Archives — Koch Capital">
  <meta property="og:description" content="Frontier-first commentary. AI · Minerals · Aerospace · Defense-Tech · Energy · Sports.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://archives.kochcapital.io">
  <meta property="og:image" content="https://archives.kochcapital.io/assets/og-image.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #000000;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 96px 32px 120px;
    }

    /* ---------- HEADER ---------- */
    header {
      margin-bottom: 96px;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: auto;
      margin: 0 auto 40px;
      display: block;
    }

    .title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 52px;
      letter-spacing: 3px;
      margin-bottom: 20px;
      line-height: 1;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .sectors {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid #000;
      font-size: 11px;
      letter-spacing: 3px;
      color: #000;
      text-transform: uppercase;
      font-weight: 600;
    }

    .sectors span {
      display: inline-block;
      padding: 0 12px;
    }

    /* ---------- POSTS LIST ---------- */
    .posts {
      list-style: none;
    }

    .post {
      border-top: 1px solid #000;
    }

    .post:last-child {
      border-bottom: 1px solid #000;
    }

    .post a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 32px;
      padding: 28px 0;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s ease;
    }

    .post a:hover {
      opacity: 0.5;
    }

    .post-date {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #888;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .post-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 20px;
      letter-spacing: 0.5px;
      line-height: 1.3;
      flex: 1;
    }

    .empty-state {
      padding: 64px 0;
      text-align: center;
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }

    /* ---------- FOOTER ---------- */
    footer {
      margin-top: 96px;
      padding-top: 40px;
      text-align: center;
      font-size: 11px;
      color: #888;
      line-height: 1.8;
      letter-spacing: 0.5px;
    }

    footer a {
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid #000;
      padding-bottom: 1px;
    }

    .disclaimer {
      margin-top: 24px;
      font-size: 10px;
      color: #aaa;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 640px) {
      .container { padding: 56px 24px 80px; }
      .title { font-size: 38px; letter-spacing: 2px; }
      .sectors span { padding: 0 6px; font-size: 10px; }
      .post a { flex-direction: column; gap: 6px; padding: 24px 0; }
      .post-title { font-size: 17px; }
    }

    @media (max-width: 380px) {
      .sectors { font-size: 9px; }
      .sectors span { padding: 0 3px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <img src="assets/logo.png" alt="Koch Capital" class="logo">
      <h1 class="title">ARCHIVES</h1>
      <p class="subtitle">Frontier-first commentary</p>

      <div class="sectors">
        <span>AI</span><span>MINERALS</span><span>AEROSPACE</span><span>DEFENSE-TECH</span><span>ENERGY</span><span>SPORTS</span>
      </div>
    </header>

    <main>
      <ul class="posts">

        <!-- =========================================================== -->

        </li>

        Example filled in:

          </a>
        </li>

        -->

        <!-- ========================== -->
        <!--   POSTS GO ABOVE THIS LINE -->
        <!-- ========================== -->

        <li class="empty-state">
          Archive coming soon
        </li>

      </ul>
    </main>

    <footer>
      <a href="https://kochcapital.io">kochcapital.io</a>

      <div class="disclaimer">
        Personal commentary. Not investment advice.<br>
        Not an offer or solicitation.
      </div>
    </footer>

  </div>
</body>
</html>
